<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000033">
<title>TriGo メッセージ動画</title>
<style>
  html, body { margin: 0; padding: 0; background: #000033; height: 100%; overflow: hidden; }
  #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000033; }
  #play {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; background: rgba(0,0,51,.35);
    border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #play .circle {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center;
  }
  #play .tri {
    width: 0; height: 0; margin-left: 6px;
    border-left: 26px solid #000033; border-top: 16px solid transparent; border-bottom: 16px solid transparent;
  }
  #play .label { color: #fff; font-family: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 15px; letter-spacing: .04em; }
  #msg { color: #fff; font-family: "BIZ UDGothic", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 15px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<video id="v" playsinline preload="auto" controls></video>
<button id="play" aria-label="再生">
  <span class="circle"><span class="tri"></span></span>
  <span class="label">タップで再生</span>
</button>
<script>
  var params = new URLSearchParams(location.search);
  var id = params.get('v');
  var video = document.getElementById('v');
  var btn = document.getElementById('play');
  if (!id) {
    btn.style.display = 'none';
    var m = document.createElement('div');
    m.id = 'msg';
    m.textContent = '動画が指定されていません。';
    document.body.appendChild(m);
  } else {
    video.src = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id);
    btn.addEventListener('click', function () {
      btn.style.display = 'none';
      var p = video.play();
      try {
        if (video.requestFullscreen) { video.requestFullscreen().catch(function(){}); }
        else if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); }
      } catch (e) {}
      if (p && p.catch) { p.catch(function(){}); }
    });
    video.addEventListener('pause', function () {
      if (video.ended) { btn.style.display = 'flex'; }
    });
  }
</script>
</body>
</html>
